name: Refresh profile cards
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/**", "assets/**"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Fetch contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='query{user(login:"Gizzer77"){repositories(ownerAffiliations:OWNER){totalCount} contributionsCollection{contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}' > raw.json
          jq '[.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[]]' raw.json > data/contributions.json
          echo "REPO_COUNT=$(jq '.data.user.repositories.totalCount' raw.json)" >> "$GITHUB_ENV"
          rm raw.json
      - name: Render cards
        run: |
          python scripts/render_readme_cards.py
          THEME=dark python scripts/render_readme_cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
